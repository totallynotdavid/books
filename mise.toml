[tools]
bun = "1.4.2"
node = "24.22.0"

[tasks.install]
description = "Install dependencies from bun.lock"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Lint the code and check the formatting of Markdown and YAML"
depends = ["lint:*"]

[tasks."lint:ts"]
description = "Lint with Biome"
run = "bunx biome check ."

[tasks."lint:docs"]
description = "Check Markdown, YAML and JSON formatting with oxfmt"
# biome.json turns the Biome formatter off for JSON, so oxfmt is its only formatter.
run = "bunx oxfmt --check '**/*.{md,yml,json}'"

[tasks.fix]
description = "Apply safe Biome fixes and format Markdown, YAML and JSON"
run = ["bunx biome check --write .", "bunx oxfmt '**/*.{md,yml,json}'"]

[tasks.typecheck]
description = "Type-check with tsc"
run = "bunx tsc --noEmit"

[tasks.test]
description = "Run the tests"
run = "bun test"

[tasks.build]
description = "Bundle src/index.ts into dist/ with bunup"
run = ["rm -rf dist", "bunx bunup --minify"]

[tasks.check]
description = "Run every check: lint, typecheck, test and build"
depends = ["lint", "typecheck", "test", "build"]
